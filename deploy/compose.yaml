# Local demo: a replaying upstream (real Qwen3.5 recordings, real timing, no
# GPU), the proxy, a load generator, Prometheus and Grafana.
#
#   docker compose -f deploy/compose.yaml up --build
#   Grafana: http://127.0.0.1:3000  (dashboard "LLM workload shape")
#   Proxy:   http://127.0.0.1:8080  (OpenAI-compatible)
services:
  upstream:
    build: ..
    entrypoint: ["/usr/local/bin/fakeupstream", "-addr", "0.0.0.0:8081", "-replay", "/replay/ollama-qwen35", "-speed", "1"]
  proxy:
    build: ..
    command: ["-config", "/etc/llm-shape-proxy/config.yaml"]
    volumes:
      - ./proxy.yaml:/etc/llm-shape-proxy/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [upstream]
  loadgen:
    build: ..
    entrypoint: ["/usr/local/bin/loadgen", "-target", "http://proxy:8080", "-replay", "/replay/ollama-qwen35", "-concurrency", "4", "-rate", "0.5"]
    depends_on: [proxy]
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shape-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

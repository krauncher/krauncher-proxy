# Local demo: a replaying upstream (real Qwen3.5 recordings, real timing, no
# GPU), the proxy, a load generator, Prometheus and Grafana.
#
#   docker compose -f deploy/compose.yaml up --build
#   Grafana: http://127.0.0.1:3000  (dashboard "LLM workload shape")
#   Proxy:   http://127.0.0.1:8080  (OpenAI-compatible)
# One image holds the proxy and the demo tools; it is built once (by the
# proxy service) and reused.
services:
  upstream:
    image: llm-shape-proxy:dev
    pull_policy: never
    entrypoint: ["/usr/local/bin/fakeupstream", "-addr", "0.0.0.0:8081", "-replay", "/replay/ollama-qwen35", "-speed", "1"]
  proxy:
    image: llm-shape-proxy:dev
    build: ..
    command: ["-config", "/etc/llm-shape-proxy/config.yaml"]
    volumes:
      - ./proxy.yaml:/etc/llm-shape-proxy/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    # Longer than shutdown.grace (60s) so in-flight streams finish on stop;
    # Docker's default of 10s would SIGKILL them.
    stop_grace_period: 70s
    depends_on: [upstream]
  loadgen:
    image: llm-shape-proxy:dev
    pull_policy: never
    entrypoint: ["/usr/local/bin/loadgen", "-target", "http://proxy:8080", "-replay", "/replay/ollama-qwen35", "-concurrency", "4", "-rate", "0.5"]
    depends_on: [proxy]
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shape-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
